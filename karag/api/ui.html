<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KARAG · Console</title>
<style>
:root{--ink:#0f1b2d;--mut:#64748b;--line:#e7ebf1;--bg:#f5f7fa;--surf:#fff;--accent:#3554d1;--accent-d:#27409e;--good:#0ca678;--dang:#d04545}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:1.5px;color:var(--accent)}
header input{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
header button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
nav{display:flex;gap:4px;padding:8px 16px;background:var(--surf);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:8px 0 4px}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;margin-top:10px}
.btn.sec{background:#eef2fe;color:var(--accent-d)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.msg{margin:10px 0;padding:10px 12px;border-radius:10px;font-size:14px;white-space:pre-wrap}
.msg.you{background:#eef2fe}.msg.bot{background:#fff;border:1px solid var(--line)}
.tag{display:inline-block;font-size:11px;background:#eef2fe;color:var(--accent-d);border-radius:6px;padding:2px 7px;margin:2px 4px 0 0}
.mut{color:var(--mut);font-size:12px}
code{background:#eef1f6;padding:1px 5px;border-radius:5px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
.pill{font-size:11px;border-radius:6px;padding:1px 7px}.pill.allow{background:#e6f7f1;color:#0a7a59}.pill.deny{background:#fcecec;color:var(--dang)}
.status{font-size:12px;color:var(--mut);margin-left:auto}
a.dl{display:inline-block;margin-top:6px;font-size:13px;color:var(--accent-d)}
</style>
</head>
<body>
<header>
  <span class="logo">KARAG</span>
  <input id="base" placeholder="API base (blank = same origin)"/>
  <input id="token" placeholder="Bearer token / JWT"/>
  <button onclick="saveAuth()">Save</button>
  <a href="/builder" style="font-size:13px;color:var(--accent-d);text-decoration:none;font-weight:600;white-space:nowrap">Builder →</a>
  <span id="status" class="status"></span>
</header>
<nav>
  <button data-tab="chat" class="on">Chat</button>
  <button data-tab="assistants">Assistants</button>
  <button data-tab="docs">Documents</button>
  <button data-tab="audit">Audit</button>
  <button data-tab="usage">Usage</button>
</nav>
<main>
  <!-- CHAT -->
  <section id="chat" class="panel on">
    <div class="card">
      <label>Assistant</label>
      <select id="asst-sel"><option value="">— default (no assistant) —</option></select>
      <div id="log" style="margin-top:12px"></div>
      <div class="row" style="margin-top:8px">
        <input id="q" type="text" placeholder="Ask about policies or live figures…"/>
        <button class="btn" style="flex:0 0 auto" onclick="ask()">Ask</button>
      </div>
    </div>
  </section>

  <!-- ASSISTANTS -->
  <section id="assistants" class="panel">
    <div class="card">
      <h3 style="margin:0 0 8px">Create an assistant</h3>
      <label>Name</label><input id="a-name" type="text" placeholder="Helpdesk"/>
      <label>Instruction</label><textarea id="a-inst" placeholder="Answer concisely and cite sources."></textarea>
      <label>Allowed skills (none selected = all you can access)</label>
      <div id="a-skills" class="mut">load token to list skills…</div>
      <button class="btn" onclick="createAssistant()">Create</button>
    </div>
    <div class="card"><h3 style="margin:0 0 8px">Your assistants</h3><div id="a-list" class="mut">—</div></div>
  </section>

  <!-- DOCS -->
  <section id="docs" class="panel">
    <div class="card">
      <h3 style="margin:0 0 8px">Add a document (text)</h3>
      <label>Title</label><input id="d-title" type="text"/>
      <label>Text</label><textarea id="d-text"></textarea>
      <label>Data class</label>
      <select id="d-class"><option>public</option><option>operational</option><option>hr</option><option>financial</option><option>regulated</option></select>
      <button class="btn" onclick="ingestText()">Ingest text</button>
    </div>
    <div class="card">
      <h3 style="margin:0 0 8px">Upload a file (.docx/.xlsx/.pptx/.pdf/.csv/.txt/.md)</h3>
      <input id="d-file" type="file"/>
      <label>Data class</label>
      <select id="f-class"><option>public</option><option>operational</option><option>hr</option><option>financial</option><option>regulated</option></select>
      <button class="btn" onclick="ingestFile()">Upload &amp; ingest</button>
    </div>
  </section>

  <!-- AUDIT -->
  <section id="audit" class="panel">
    <div class="card"><h3 style="margin:0 0 8px">Audit trail (admin)</h3><button class="btn sec" onclick="loadAudit()">Refresh</button><div id="audit-t" style="margin-top:10px"></div></div>
  </section>

  <!-- USAGE -->
  <section id="usage" class="panel">
    <div class="card"><h3 style="margin:0 0 8px">Usage</h3><button class="btn sec" onclick="loadUsage()">Refresh</button><div id="usage-t" style="margin-top:10px" class="mut">—</div></div>
  </section>
</main>

<script>
const $ = (id)=>document.getElementById(id);
function base(){ return ($('base').value||'').replace(/\/$/,''); }
function token(){ return $('token').value.trim(); }
function setStatus(t,ok){ const s=$('status'); s.textContent=t; s.style.color=ok===false?'#d04545':'#64748b'; }
function saveAuth(){ localStorage.setItem('karag_base',base()); localStorage.setItem('karag_token',token()); setStatus('saved'); loadSkills(); loadAssistants(); }
(function(){ $('base').value=localStorage.getItem('karag_base')||''; $('token').value=localStorage.getItem('karag_token')||''; })();

async function api(path, opts={}){
  const h = Object.assign({'Authorization':'Bearer '+token()}, opts.headers||{});
  if (opts.json!==undefined){ h['Content-Type']='application/json'; opts.body=JSON.stringify(opts.json); delete opts.json; }
  const r = await fetch(base()+path, Object.assign({},opts,{headers:h}));
  const ct=r.headers.get('content-type')||'';
  const data = ct.includes('application/json') ? await r.json() : await r.text();
  if(!r.ok){ throw new Error((data && data.detail)||('HTTP '+r.status)); }
  return data;
}

// tabs
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); $(b.dataset.tab).classList.add('on');
});

function addMsg(role, html){ const d=document.createElement('div'); d.className='msg '+(role==='You'?'you':'bot'); d.innerHTML='<b>'+role+':</b> '+html; $('log').appendChild(d); d.scrollIntoView(); }

async function ask(){
  const q=$('q').value.trim(); if(!q) return; $('q').value='';
  addMsg('You', escapeHtml(q));
  try{
    const id=$('asst-sel').value;
    const path = id ? ('/v1/assistants/'+id+'/ask') : '/v1/ask';
    const a = await api(path,{method:'POST',json:{query:q}});
    let html = escapeHtml(a.text||'(no answer)');
    if(a.plane) html += ' <span class="tag">'+a.plane+'</span>';
    if(a.skills_used && a.skills_used.length) html += a.skills_used.map(s=>'<span class="tag">skill: '+escapeHtml(s)+'</span>').join('');
    if(a.citations && a.citations.length) html += '<div class="mut" style="margin-top:6px">Sources: '+a.citations.map(c=>escapeHtml(c.title)).join(', ')+'</div>';
    if(a.queries_shown && a.queries_shown.length) html += '<div class="mut" style="margin-top:4px">Query: <code>'+escapeHtml(a.queries_shown.join('; '))+'</code></div>';
    (a.artifacts||[]).forEach(art=>{ html += '<div>'+downloadLink(art)+'</div>'; });
    addMsg('KARAG', html);
  }catch(e){ addMsg('Error', escapeHtml(e.message)); }
}

function downloadLink(art){
  const bytes=atob(art.content_base64); const buf=new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++) buf[i]=bytes.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([buf],{type:art.mime}));
  return '<a class="dl" download="'+escapeHtml(art.filename)+'" href="'+url+'">⬇ '+escapeHtml(art.filename)+' ('+art.size_bytes+' bytes)</a>';
}

async function loadSkills(){
  try{ const d=await api('/v1/skills');
    if(!d.skills.length){ $('a-skills').textContent='(no skills available to you)'; return; }
    $('a-skills').innerHTML = d.skills.map(s=>'<label style="font-weight:400;color:#0f1b2d"><input type="checkbox" value="'+escapeHtml(s.name)+'"> '+escapeHtml(s.name)+' <span class="mut">— '+escapeHtml(s.description)+'</span></label>').join('');
  }catch(e){ $('a-skills').textContent='('+e.message+')'; }
}
async function createAssistant(){
  const boxes=[...document.querySelectorAll('#a-skills input:checked')].map(b=>b.value);
  const body={name:$('a-name').value,instruction:$('a-inst').value};
  if(boxes.length) body.allowed_skill_names=boxes;
  try{ await api('/v1/assistants',{method:'POST',json:body}); setStatus('assistant created'); loadAssistants(); }
  catch(e){ setStatus(e.message,false); }
}
async function loadAssistants(){
  try{ const d=await api('/v1/assistants'); const sel=$('asst-sel');
    sel.innerHTML='<option value="">— default (no assistant) —</option>'+d.assistants.map(a=>'<option value="'+a.id+'">'+escapeHtml(a.name)+'</option>').join('');
    $('a-list').innerHTML = d.assistants.length? d.assistants.map(a=>'<div>• '+escapeHtml(a.name)+' <span class="mut">'+a.id+'</span></div>').join('') : '(none yet)';
  }catch(e){ $('a-list').textContent='('+e.message+')'; }
}
async function ingestText(){
  try{ const r=await api('/v1/ingest',{method:'POST',json:{title:$('d-title').value,text:$('d-text').value,data_class:$('d-class').value}}); setStatus('ingested '+r.document_id); }
  catch(e){ setStatus(e.message,false); }
}
async function ingestFile(){
  const f=$('d-file').files[0]; if(!f){ setStatus('choose a file',false); return; }
  const fd=new FormData(); fd.append('file',f); fd.append('data_class',$('f-class').value);
  try{ const r=await fetch(base()+'/v1/ingest/file',{method:'POST',headers:{'Authorization':'Bearer '+token()},body:fd});
    const d=await r.json(); if(!r.ok) throw new Error(d.detail||('HTTP '+r.status)); setStatus('ingested '+d.document_id); }
  catch(e){ setStatus(e.message,false); }
}
async function loadAudit(){
  try{ const d=await api('/v1/audit');
    $('audit-t').innerHTML='<table><tr><th>action</th><th>decision</th><th>user</th><th>resource</th></tr>'+
      d.events.slice(-100).reverse().map(e=>'<tr><td>'+e.action+'</td><td><span class="pill '+e.decision+'">'+e.decision+'</span></td><td>'+escapeHtml(e.user_id)+'</td><td class="mut">'+escapeHtml(String(e.resource||''))+'</td></tr>').join('')+'</table>';
  }catch(e){ $('audit-t').textContent='('+e.message+')'; }
}
async function loadUsage(){
  try{ const u=await api('/v1/usage');
    $('usage-t').innerHTML='Requests: <b>'+u.requests+'</b> · Input tokens: <b>'+u.input_tokens+'</b> · Output tokens: <b>'+u.output_tokens+'</b> · Total: <b>'+u.total_tokens+'</b>';
  }catch(e){ $('usage-t').textContent='('+e.message+')'; }
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

if(token()){ loadSkills(); loadAssistants(); }
</script>
</body>
</html>
