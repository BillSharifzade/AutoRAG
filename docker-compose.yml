# The whole KARAG platform in one command:
#
#     docker compose up --build
#
# Console  → http://localhost:3000   (sign in with a token from KARAG_TOKENS)
# API      → http://localhost:8000   (/health, /v1/*)
#
# Provider keys and tokens come from .env — copy .env.example if you have none.
# State lives in ./data, so it survives `docker compose down`.

x-api-env: &api-env
  # SQLite by default: no extra service to run, and the files are visible in
  # ./data. Point KARAG_STORE at pgvector instead for a real deployment.
  KARAG_STORE: sqlite
  KARAG_SQLITE_PATH: /data/karag.db
  KARAG_APP_STORE: sqlite
  KARAG_APP_DB: /data/karag_app.db
  KARAG_CHAT_STORE: sqlite
  KARAG_CHAT_DB: /data/karag_chats.db
  KARAG_USAGE_STORE: sqlite
  KARAG_USAGE_DB: /data/karag_usage.db
  # uploaded database files (SQLite, imported SQL dumps) live next to the rest
  KARAG_UPLOAD_DIR: /data/uploads

services:
  api:
    build: .
    image: karag-api
    env_file:
      - .env
    # These win over .env, whose paths are relative to the host checkout.
    environment: *api-env
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Baked into the rewrite rules at build time — see web/next.config.ts.
        KARAG_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Evaluates stored alert rules on their own cadence. Idle until someone
  # creates a rule, so it costs nothing on a fresh install.
  scheduler:
    build: .
    image: karag-api
    command: ["python", "scripts/run_scheduler.py"]
    env_file:
      - .env
    environment: *api-env
    volumes:
      - ./data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Opt-in: needs KARAG_TELEGRAM_BOT_TOKEN in .env, and exits without one.
  #     docker compose --profile telegram up
  telegram:
    build: .
    image: karag-api
    command: ["python", "scripts/run_telegram_bot.py"]
    profiles: ["telegram"]
    env_file:
      - .env
    environment: *api-env
    volumes:
      - ./data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
